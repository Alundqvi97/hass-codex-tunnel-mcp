name: Offline Security and Integration Tests
on:
  push:
    branches: [main, security/tunnel-auth-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Syntax validation
        run: python -m compileall -q custom_components tests
      - name: Full upstream and security test suite
        run: python -m pytest -q tests
      - name: Check no non-loopback test sockets
        run: python -c "from pathlib import Path; p=Path('tests/test_security_hardening.py').read_text(); assert '127.0.0.1' in p and 'ThreadingHTTPServer' in p"
