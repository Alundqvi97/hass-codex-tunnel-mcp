name: Phase 2D - HA-MCP Upstream Patch Candidates
on:
  push:
    branches: [security/ha-mcp-phase2d-candidates]
  pull_request:
    branches: [security/tunnel-auth-hardening]
permissions:
  contents: read
concurrency:
  group: phase2d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-upstream-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: homeassistant-ai/ha-mcp
          ref: fc54437a804858732e4bc927add98e202d879a09
          path: ha_mcp_pinned
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify pinned upstream revision and baseline blobs
        run: |
          test "$(git -C ha_mcp_pinned rev-parse HEAD)" = fc54437a804858732e4bc927add98e202d879a09
          python docs/security/phase2d/patch_candidates.py policy
          python docs/security/phase2d/patch_candidates.py logging
          python -m compileall -q docs/security/phase2d tests/staging
      - name: Install exact upstream locked dependencies
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.20'
          cd ha_mcp_pinned
          uv sync --locked --no-dev --python 3.13
          uv pip install --python .venv/bin/python 'pytest==8.4.2' 'pytest-asyncio==1.4.0' 'pytest-timeout==2.4.0'
      - name: Verify unchanged upstream baseline behavior
        env:
          PYTHONPATH: ha_mcp_pinned/src
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          HOMEASSISTANT_URL: http://127.0.0.1:1
          HOMEASSISTANT_TOKEN: synthetic-unused-token
        run: |
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x tests/staging/test_real_ha_mcp_860.py
      - name: Apply independently scoped SHA-guarded candidates
        run: |
          python docs/security/phase2d/patch_candidates.py policy --apply
          python docs/security/phase2d/patch_candidates.py logging --apply
          git -C ha_mcp_pinned diff --check
          test "$(git -C ha_mcp_pinned diff --name-only | wc -l)" -eq 2
          git -C ha_mcp_pinned diff -- src/ha_mcp/server.py homeassistant-addon/start.py > /tmp/phase2d-candidate.patch
          test -s /tmp/phase2d-candidate.patch
          git -C ha_mcp_pinned apply --check -R /tmp/phase2d-candidate.patch
      - name: Test genuine patched implementation with synthetic inputs
        env:
          PYTHONPATH: ha_mcp_pinned/src
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          HOMEASSISTANT_URL: http://127.0.0.1:1
          HOMEASSISTANT_TOKEN: synthetic-unused-token
        run: |
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x tests/staging/test_phase2d_candidates.py
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x ha_mcp_pinned/tests/src/unit/test_server_policy_wiring.py ha_mcp_pinned/tests/addon/test_server_config.py
      - name: Prove byte-exact clean rollback to pinned upstream
        run: |
          git -C ha_mcp_pinned apply -R /tmp/phase2d-candidate.patch
          git -C ha_mcp_pinned diff --exit-code -- src/ha_mcp/server.py homeassistant-addon/start.py
          test "$(git -C ha_mcp_pinned hash-object src/ha_mcp/server.py)" = bf848dcec8345eba603295933768fca6724c913b
          test "$(git -C ha_mcp_pinned hash-object homeassistant-addon/start.py)" = 88e926a59f568dc9a9bf7bcd719b518b42f52baa
          echo 'Both candidate changes reversed; source blobs match exact pinned baseline.'
