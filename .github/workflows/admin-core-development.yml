name: Native Core Administrator Development
on:
  push:
    branches: [security/ha-mcp-phase2d-candidates]
    paths:
      - custom_components/hass_codex_admin/**
      - tests/staging/*admin*.py
      - requirements/admin-test.*
      - .github/workflows/admin-core-development.yml
  pull_request:
    branches: [security/tunnel-auth-hardening]
    paths:
      - custom_components/hass_codex_admin/**
      - tests/staging/*admin*.py
      - requirements/admin-test.*
      - .github/workflows/admin-core-development.yml
permissions: {contents: read}
concurrency:
  group: native-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-loopback-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14.2'}
      - name: Install hash-verified disposable Core fixture
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/admin-test.lock.txt
      - name: Native MCP, owner approval, state, faults and process restart
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: '${{ runner.temp }}/admin-pycache'
        run: |
          python -B -m unittest discover -s tests/staging -p 'test_admin_product.py' -v
          python -B -m py_compile custom_components/hass_codex_admin/*.py tests/staging/*admin*.py
          node --check custom_components/hass_codex_admin/panel.js
          git diff --check
          git diff --exit-code
