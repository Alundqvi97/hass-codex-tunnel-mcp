name: Native Core Administrator Development
on:
  push:
    branches: [security/ha-mcp-phase2d-candidates]
    paths:
      - custom_components/hass_codex_admin/**
      - custom_components/hass_codex_tunnel_mcp/**
      - tests/staging/*admin*.py
      - tests/staging/admin_browser_fixture.cjs
      - scripts/development/**
      - requirements/admin-test.*
      - .github/workflows/admin-core-development.yml
  pull_request:
    branches: [security/tunnel-auth-hardening]
    paths:
      - custom_components/hass_codex_admin/**
      - custom_components/hass_codex_tunnel_mcp/**
      - tests/staging/*admin*.py
      - tests/staging/admin_browser_fixture.cjs
      - scripts/development/**
      - requirements/admin-test.*
      - .github/workflows/admin-core-development.yml
permissions: {contents: read}
concurrency:
  group: native-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-loopback-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14.2'}
      - name: Install hash-verified disposable Core fixture
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/admin-test.lock.txt
      - name: Build and verify production-only archive
        run: |
          python -B scripts/development/package.py "$RUNNER_TEMP/native-admin.zip"
          python -B scripts/development/package.py --verify "$RUNNER_TEMP/native-admin.zip" > "$RUNNER_TEMP/native-admin-manifest.json"
      - name: Native MCP, owner approval, state, faults and process restart
        env:
          ADMIN_RELEASE_ARCHIVE: '${{ runner.temp }}/native-admin.zip'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: '${{ runner.temp }}/admin-pycache'
        run: |
          python -B -m unittest discover -s tests/staging -p 'test_admin_product.py' -v
          python -B -m unittest discover -s tests/staging -p 'test_admin_package.py' -v
          python -B -m py_compile custom_components/hass_codex_admin/*.py custom_components/hass_codex_tunnel_mcp/*.py tests/staging/*admin*.py
          node --check custom_components/hass_codex_admin/panel.js
          node --check tests/staging/admin_browser_fixture.cjs
          bash -n scripts/development/install.sh
          git diff --check
          git diff --exit-code
      - name: Sandboxed actual owner panel and native login
        env:
          ADMIN_RELEASE_ARCHIVE: '${{ runner.temp }}/native-admin.zip'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: '${{ runner.temp }}/admin-pycache'
        run: |
          mkdir "$RUNNER_TEMP/admin-browser"
          cp tests/staging/browser/package*.json "$RUNNER_TEMP/admin-browser/"
          npm ci --prefix "$RUNNER_TEMP/admin-browser" --ignore-scripts --no-audit --no-fund
          export NODE_PATH="$RUNNER_TEMP/admin-browser/node_modules"
          export ADMIN_BROWSER_EXECUTABLE="$(command -v google-chrome)"
          test -n "$ADMIN_BROWSER_EXECUTABLE"
          python -B -m unittest discover -s tests/staging -p 'test_admin_browser.py' -v
      - name: Verified official client, loopback control plane only
        env:
          ADMIN_RELEASE_ARCHIVE: '${{ runner.temp }}/native-admin.zip'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: '${{ runner.temp }}/admin-pycache'
        run: |
          mkdir "$RUNNER_TEMP/admin-official-client"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/openai/tunnel-client/releases/download/v0.0.16/tunnel-client-v0.0.16-linux-amd64.zip -o "$RUNNER_TEMP/admin-official-client/client.zip"
          echo 'd60cdba019bce451bcc3a15478cc5b9cb11270b049f5b56ea39a80b517f8b117  client.zip' > "$RUNNER_TEMP/admin-official-client/SHA256SUMS"
          (cd "$RUNNER_TEMP/admin-official-client" && sha256sum --check SHA256SUMS)
          python -c 'import os,zipfile; p=os.environ["RUNNER_TEMP"]+"/admin-official-client"; z=zipfile.ZipFile(p+"/client.zip"); z.extract("tunnel-client",p)'
          chmod 700 "$RUNNER_TEMP/admin-official-client/tunnel-client"
          export ADMIN_OFFICIAL_CLIENT="$RUNNER_TEMP/admin-official-client/tunnel-client"
          python -B -m unittest discover -s tests/staging -p 'test_admin_official_transport.py' -v
