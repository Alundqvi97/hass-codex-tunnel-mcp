name: Phase 2H - One Disposable HAOS Supervisor Guest
on:
  push:
    branches: [security/ha-mcp-phase2d-candidates]
    paths: [.github/workflows/phase2h-haos-vm-once.yml]
permissions:
  contents: read
jobs:
  single-ephemeral-github-hosted-vm:
    if: ${{ github.repository == 'Alundqvi97/hass-codex-tunnel-mcp' && github.ref == 'refs/heads/security/ha-mcp-phase2d-candidates' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: homeassistant-ai/ha-mcp
          ref: fc54437a804858732e4bc927add98e202d879a09
          path: ha_mcp_pinned
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Validate bounded experiment scripts before any host change
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/security/phase2h/runner_once.sh
          python -m py_compile docs/security/phase2h/single_haos_guest.py
          python -m py_compile docs/security/phase2g/middleware_revalidation.py
          test "$(git -C ha_mcp_pinned rev-parse HEAD)" = fc54437a804858732e4bc927add98e202d879a09
          echo PHASE2H_SCRIPT_PREFLIGHT=PASS
      - name: Install locked Python helper from package index
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'websockets==15.0.1'
      - name: ONE bounded guest using Ubuntu Noble 4MiB OVMF and sanitized no-artifact results
        shell: bash
        timeout-minutes: 41
        run: bash docs/security/phase2h/runner_once.sh
