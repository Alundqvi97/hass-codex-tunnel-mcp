name: Phase 2F - Supported Strict Addon Staging
on:
  push:
    branches: [security/ha-mcp-phase2d-candidates]
permissions:
  contents: read
concurrency:
  group: phase2f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-pinned-source-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: homeassistant-ai/ha-mcp
          ref: fc54437a804858732e4bc927add98e202d879a09
          path: ha_mcp_pinned
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13'}
      - name: Verify all original Git blobs and syntax
        run: |
          python -m py_compile docs/security/phase2f/strict_addon_candidate.py tests/staging/test_phase2f_migration.py tests/staging/phase2f_packaged_smoke.py
          python docs/security/phase2d/patch_candidates.py policy
          python docs/security/phase2d/patch_candidates.py logging
          test "$(git -C ha_mcp_pinned rev-parse HEAD)" = fc54437a804858732e4bc927add98e202d879a09
      - name: Apply prior verified server and logging candidates
        run: |
          python docs/security/phase2d/patch_candidates.py policy --apply
          python docs/security/phase2d/patch_candidates.py logging --apply
      - name: Apply supported-schema / marker candidate
        run: |
          python docs/security/phase2f/strict_addon_candidate.py --apply
          git -C ha_mcp_pinned diff --check
          python -m compileall -q ha_mcp_pinned/src ha_mcp_pinned/homeassistant-addon/start.py
          test "$(git -C ha_mcp_pinned diff --name-only | wc -l)" -eq 3
          git -C ha_mcp_pinned diff > /tmp/phase2f-combined.patch
          git -C ha_mcp_pinned apply --check -R /tmp/phase2f-combined.patch
      - name: Install pinned upstream dependencies
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.20'
          cd ha_mcp_pinned
          uv sync --locked --no-dev --python 3.13
          uv pip install --python .venv/bin/python 'pytest==8.4.2' 'pytest-asyncio==1.4.0' 'pytest-timeout==2.4.0'
      - name: Test real pinned policy evaluator / supported option
        env:
          PYTHONPATH: ha_mcp_pinned/src
          HOMEASSISTANT_URL: http://127.0.0.1:1
          HOMEASSISTANT_TOKEN: synthetic-do-not-use
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x tests/staging/test_phase2f_migration.py
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x tests/staging/test_phase2d_candidates.py
          ha_mcp_pinned/.venv/bin/python -m pytest -q -rs -x ha_mcp_pinned/tests/src/unit/test_server_policy_wiring.py ha_mcp_pinned/tests/addon/test_server_config.py
      - name: Build actual pinned Dockerfile
        env: {DOCKER_BUILDKIT: '1'}
        run: |
          docker build --progress=plain --build-arg BUILD_VERSION=8.6.0 --build-arg BUILD_ARCH=amd64 -t ha-mcp-phase2f:local -f ha_mcp_pinned/homeassistant-addon/Dockerfile ha_mcp_pinned
      - name: Isolated packaged startup / durable marker recovery
        run: python tests/staging/phase2f_packaged_smoke.py
      - name: Prove exact original source restoration
        run: |
          git -C ha_mcp_pinned apply -R /tmp/phase2f-combined.patch
          git -C ha_mcp_pinned diff --exit-code
          test "$(git -C ha_mcp_pinned hash-object src/ha_mcp/server.py)" = bf848dcec8345eba603295933768fca6724c913b
          test "$(git -C ha_mcp_pinned hash-object homeassistant-addon/start.py)" = 88e926a59f568dc9a9bf7bcd719b518b42f52baa
          test "$(git -C ha_mcp_pinned hash-object homeassistant-addon/config.yaml)" = 0079f23fd040651892a2dc2b2652b64af0e0a3d4
          echo 'PHASE2F_ALL_PATCHES_REVERSED_TO_IMMUTABLE_UPSTREAM'
      - name: Ensure no test containers remain
        if: always()
        run: |
          ids="$(docker ps -aq --filter label=phase2f)"
          if [ -n "$ids" ]; then docker rm -f $ids >/dev/null; fi
          docker image rm -f ha-mcp-phase2f:local >/dev/null 2>&1 || true
